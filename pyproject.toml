[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatou-backend"
version = "0.1.0"
description = "Python wrapper around Sheldonison's fatou.gp tetration engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mpmath>=1.3"]

[project.urls]
Repository = "https://github.com/Lightrunnerwastaken/gp-tetration"

[project.scripts]
fatou-cli = "fatou_backend.cli:main"
mixed-phase-cli = "fatou_backend.mixed_phase:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fatou_backend = ["vendor/fatou.gp", "vendor/fatou_fork.gp", "vendor/NOTICE.md"]
